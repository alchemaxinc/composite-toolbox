name: 'Create Pull Request'

description: 'Create PR with dependency updates'

inputs:
  token:
    required: true
    description: 'GitHub token'

  base-branch:
    required: true
    description: 'Base branch for PR'

  branch-prefix:
    required: true
    description: 'Prefix for new branch'

  branch-postfix:
    required: false
    description: 'Postfix for new branch, defaults to a unique string on each run to avoid overwrites of existing branches'
    default: ''

  files:
    required: true
    description: 'Files to commit'

  commit-message:
    required: true
    description: 'Message the commit will have'

  pr-title:
    required: true
    description: 'Title of the pull request'

  pr-body:
    required: true
    description: 'The Markdown-supported body for the Github pull request'

outputs:
  pr_number:
    description: 'Number of the created pull request'
    value: ${{ steps.create_pr.outputs.pr_number }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        FILES_TO_ADD: ${{ inputs.files }}
      run: |
        if [ -z "$FILES_TO_ADD" ]; then
          echo "::error::The 'files' input cannot be empty. It represents files to add with 'git add'. If you meant to add all files, use '.' as the files input."
          exit 1
        fi

    - name: Create and push branch
      id: create_branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        FILES_TO_ADD: ${{ inputs.files }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        BRANCH_POSTFIX: ${{ inputs.branch-postfix }}
        RUN_ID: ${{ github.run_id }}
      run: |
        if [ -z "$BRANCH_POSTFIX" ]; then
          BRANCH_NAME="${BRANCH_PREFIX}-$(date +%Y%m%d)-${RUN_ID}"
        else
          BRANCH_NAME="${BRANCH_PREFIX}-${BRANCH_POSTFIX}"
        fi

        # Reject characters that are not valid in a git branch name and
        # would otherwise corrupt the GITHUB_OUTPUT write below (for
        # example, a newline injecting extra output variables).
        if [[ ! $BRANCH_NAME =~ ^[A-Za-z0-9._/-]+$ ]]; then
          echo "::error::Computed branch name '$BRANCH_NAME' contains invalid characters. branch-prefix and branch-postfix must only contain letters, digits, '.', '_', '/', or '-'."
          exit 1
        fi

        echo "::debug::Creating branch: $BRANCH_NAME"
        git checkout -b "$BRANCH_NAME"

        echo "::debug::Adding files: $FILES_TO_ADD"
        # Split on whitespace into an array so each pathspec (which may
        # include globs such as '*.json') reaches git add unmodified.
        read -r -a FILES_ARR <<<"$FILES_TO_ADD"
        git add -- "${FILES_ARR[@]}"

        if git diff --cached --quiet; then
          echo "::notice::No changes to commit — pushing branch as-is (for example, a backmerge)"
        else
          echo "::debug::Committing changes with message: '$COMMIT_MESSAGE'"
          git commit -m "$COMMIT_MESSAGE"
        fi

        echo "::debug::Pushing branch $BRANCH_NAME to origin"
        git push --force-with-lease origin "$BRANCH_NAME"

        echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

    - name: Create Pull Request
      id: create_pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        BRANCH_NAME: ${{ steps.create_branch.outputs.branch_name }}
      run: |
        echo "::debug::Creating pull request from $BRANCH_NAME to $BASE_BRANCH"
        PR_URL=$(gh pr create \
          --title "$PR_TITLE" \
          --body "$PR_BODY" \
          --head "$BRANCH_NAME" \
          --base "$BASE_BRANCH")

        echo "::debug::Pull request created at: $PR_URL"

        PR_NUMBER=$(gh pr view "$PR_URL" --json number --jq .number)
        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
