name: 'Sync Tags in Documentation'

description: 'Update GitHub action tags in documentation files to match the current version'

inputs:
  file-extensions:
    required: false
    default: '.md'
    description: 'Space-separated list of file extensions to scan (for example, ".md .txt")'

  github-repo-path:
    required: true
    description: 'GitHub repository path (for example, "alchemaxinc/update-deps")'

  folder:
    required: false
    default: '.'
    description: 'Folder to scan for files (defaults to repository root)'

  current-tag:
    required: true
    description: 'Current GitHub tag to update to (for example, "v1.10.2")'

outputs:
  files_updated:
    description: 'Space-separated list of files that were updated'
    value: ${{ steps.update_tags.outputs.files_updated }}

runs:
  using: 'composite'
  steps:
    - name: Validate tag
      id: validate_tag
      shell: bash
      env:
        TAG: ${{ inputs.current-tag }}
      run: |
        echo "::debug::Validating tag: $TAG"

        if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$TAG' must be a full semantic version with v prefix (for example, v1.10.2 or v1.10.2-beta.1)"
          exit 1
        fi

        echo "::debug::Tag validation passed: $TAG"

    - name: Find and update tags in documentation
      id: update_tags
      shell: bash
      env:
        EXTENSIONS: ${{ inputs.file-extensions }}
        FOLDER: ${{ inputs.folder }}
        REPO_PATH: ${{ inputs.github-repo-path }}
        NEW_TAG: ${{ inputs.current-tag }}
      run: |
        FILES_UPDATED=""

        echo "::debug::Scanning folder: $FOLDER"
        echo "::debug::File extensions: $EXTENSIONS"
        echo "::debug::Repository path: $REPO_PATH"
        echo "::debug::New tag: $NEW_TAG"

        # Reject '..' path segments so this action cannot be pointed outside
        # the checked-out workspace via the folder input.
        if [[ $FOLDER == *..* ]]; then
          echo "::error::The 'folder' input '$FOLDER' must not contain '..'. Use a path relative to the repository root."
          exit 1
        fi

        # Build the find predicate as an array so extensions never need eval.
        # Skip common vendored and VCS directories that this action must not scan.
        FIND_ARGS=(-type f "(")
        first=true
        for ext in $EXTENSIONS; do
          if [ "$first" = true ]; then
            first=false
          else
            FIND_ARGS+=(-o)
          fi
          FIND_ARGS+=(-name "*$ext")
        done
        FIND_ARGS+=(")")

        readarray -t FILES < <(find "$FOLDER" \
          \( -path '*/.git' -o -name 'node_modules' \) -prune -o \
          "${FIND_ARGS[@]}" -print 2>/dev/null || true)

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "::notice::No files found with extensions: $EXTENSIONS"
          echo "files_updated=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Escape regex metacharacters in the repo path so it can be used
        # safely as a literal inside grep/sed patterns.
        ESCAPED_REPO_PATH=$(printf '%s' "$REPO_PATH" | sed -e 's/[.[\*^$]/\\&/g' -e 's|/|\\/|g')

        for file in "${FILES[@]}"; do
          if [ ! -f "$file" ]; then
            continue
          fi

          echo "::debug::Processing file: $file"

          # Match any reference like: alchemaxinc/update-deps/something@vX or @vX.Y or @vX.Y.Z
          # and replace the tag portion with the new full tag
          if ! grep -q "${ESCAPED_REPO_PATH}[^@]*@v[0-9]" "$file"; then
            echo "::debug::No matching references in $file"
            continue
          fi

          echo "::debug::Found references in $file, updating..."

          # Save the original to a private temp file for a before/after
          # comparison, instead of clobbering an adjacent '<file>.orig'.
          tmp_orig=$(mktemp)
          trap 'rm -f "$tmp_orig"' RETURN
          cp "$file" "$tmp_orig"

          # Replace: repo-path/any-subpath@v<anything> -> repo-path/any-subpath@NEW_TAG
          # This handles @v1, @v1.2, @v1.2.3, and prerelease/build metadata
          # suffixes such as @v1.2.3-beta.1 or @v1.2.3+build.5.
          sed -i "s|\(${ESCAPED_REPO_PATH}/[^@]*\)@v[0-9][0-9A-Za-z.+-]*|\1@${NEW_TAG}|g" "$file"

          # Also handle bare repo references without subpath: repo-path@v<anything>
          sed -i "s|\(${ESCAPED_REPO_PATH}\)@v[0-9][0-9A-Za-z.+-]*|\1@${NEW_TAG}|g" "$file"

          if ! cmp -s "$file" "$tmp_orig"; then
            echo "::notice::Updated tags in $file to $NEW_TAG"
            FILES_UPDATED="$FILES_UPDATED $file"
          fi

          rm -f "$tmp_orig"
          trap - RETURN
        done

        # Trim leading space
        FILES_UPDATED=$(echo "$FILES_UPDATED" | sed 's/^ //')

        echo "::notice::Updated files: $FILES_UPDATED"
        echo "files_updated=$FILES_UPDATED" >> "$GITHUB_OUTPUT"
