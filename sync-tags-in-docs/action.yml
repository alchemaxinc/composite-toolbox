name: 'Sync Tags in Documentation (deprecated)'

description: >-
  Deprecated: use sync-action-tag-in-docs instead. This action forwards to
  it unchanged and will be removed in a future major version.

inputs:
  file-extensions:
    required: false
    default: '.md'
    description: 'Space-separated list of file extensions to scan (for example, ".md .txt")'

  github-repo-path:
    required: true
    description: 'GitHub repository path (for example, "alchemaxinc/update-deps")'

  folder:
    required: false
    default: '.'
    description: 'Folder to scan for files (defaults to repository root)'

  current-tag:
    required: true
    description: 'Current GitHub tag to update to (for example, "v1.10.2")'

outputs:
  files_updated:
    description: 'Space-separated list of files that were updated'
    value: ${{ steps.forward.outputs.files_updated }}

runs:
  using: 'composite'
  steps:
    - name: Warn about deprecated action name
      shell: bash
      run: echo "::warning::sync-tags-in-docs is deprecated, use sync-action-tag-in-docs instead."

    - name: Forward to sync-action-tag-in-docs
      id: forward
      uses: ./sync-action-tag-in-docs
      with:
        file-extensions: ${{ inputs.file-extensions }}
        github-repo-path: ${{ inputs.github-repo-path }}
        folder: ${{ inputs.folder }}
        current-tag: ${{ inputs.current-tag }}
