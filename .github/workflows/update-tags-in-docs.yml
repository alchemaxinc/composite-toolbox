name: Update Tags in Documentation

on:
  workflow_run:
    workflows: ['Semantic Versioning and Release']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to update documentation to (for example, v1.10.2)'
        required: false
        type: string

permissions: {}

concurrency:
  group: update-tags-in-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-docs:
    name: Update Documentation Tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Create temporary GitHub App Token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HOUSEKEEPING_BOT_APP_ID }}
          private-key: ${{ secrets.HOUSEKEEPING_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app.outputs.token }}

      - name: Configure git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash ./scripts/configure-git-identity.sh --local

      - name: Determine tag
        id: get-tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"

            if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$TAG' is not a full semantic version (for example, v1.10.2)"
              exit 1
            fi
          else
            git fetch --tags
            TAG=$(git describe --tags --match 'v*.*.*' --abbrev=0 2>/dev/null || echo "")

            if [ -z "$TAG" ]; then
              echo "::error::No tag found"
              exit 1
            fi

            if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::Tag '$TAG' is not a full semantic version, skipping"
              exit 0
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync tags in documentation
        id: sync-tags
        if: steps.get-tag.outputs.tag != ''
        uses: ./sync-tags-in-docs
        with:
          file-extensions: '.md'
          github-repo-path: 'alchemaxinc/composite-toolbox'
          current-tag: ${{ steps.get-tag.outputs.tag }}

      - name: Build pull request body
        id: pr-body
        if: steps.sync-tags.outputs.files_updated != ''
        shell: bash
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
          FILES_UPDATED: ${{ steps.sync-tags.outputs.files_updated }}
        run: |
          {
            echo 'pr_body<<PR_BODY_EOF'
            echo 'Automatically updates GitHub action tags in documentation files to match the latest release.'
            echo
            echo "**New tag**: \`$TAG\`"
            echo '**Files updated:**'
            for file in $FILES_UPDATED; do
              echo "- \`$file\`"
            done
            echo 'PR_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: create-pr
        if: steps.sync-tags.outputs.files_updated != ''
        uses: ./create-pr
        with:
          token: ${{ steps.app.outputs.token }}
          base-branch: 'main'
          branch-prefix: 'update-docs-tags'
          files: ${{ steps.sync-tags.outputs.files_updated }}
          commit-message: 'docs: update action tags to ${{ steps.get-tag.outputs.tag }}'
          pr-title: 'docs: update action tags to ${{ steps.get-tag.outputs.tag }}'
          pr-body: ${{ steps.pr-body.outputs.pr_body }}

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pr_number != ''
        uses: ./merge-pr
        with:
          token: ${{ steps.app.outputs.token }}
          pull-request-number: ${{ steps.create-pr.outputs.pr_number }}
          merge-method: 'squash'
