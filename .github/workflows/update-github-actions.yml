name: Update GitHub Actions

# Bumps the action versions in workflow files, opens (or updates) the bump
# pull request, and enables auto-merge on it. The caller owns the trigger, so
# the weekly schedule lives in the calling workflow.

on:
  workflow_call:
    inputs:
      app-client-id:
        description: 'Client ID of the GitHub App that opens the pull request'
        required: true
        type: string
      app-slug:
        description: 'Slug of the GitHub App. When set, the commit is attributed to the app bot; when empty, to the identity behind the token.'
        required: false
        type: string
        default: ''
      base-branch:
        description: 'Branch to open the pull request against'
        required: false
        type: string
        default: 'develop'
      file-glob:
        description: 'Glob of the workflow files to update, relative to the repository root'
        required: false
        type: string
        default: '.github/**/*.yml'
      branch-prefix:
        description: 'Prefix of the bump branch'
        required: false
        type: string
        default: 'update-actions'
      pr-title:
        description: 'Title of the pull request'
        required: false
        type: string
        default: 'chore: update github actions'
      commit-message:
        description: 'Message of the bump commit. Defaults to the pull request title.'
        required: false
        type: string
        default: ''
      auto-merge:
        description: 'Enable auto-merge on the pull request'
        required: false
        type: boolean
        default: true
      merge-method:
        description: 'Merge method for auto-merge (merge, squash, or rebase)'
        required: false
        type: string
        default: 'squash'
    secrets:
      app-private-key:
        description: 'Private key of the GitHub App'
        required: true

permissions: {}

jobs:
  update-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create temporary GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Update GitHub Actions
        uses: alchemaxinc/update-deps/actions@v2
        with:
          token: ${{ steps.app.outputs.token }}
          app-slug: ${{ inputs.app-slug }}
          base-branch: ${{ inputs.base-branch }}
          file-glob: ${{ inputs.file-glob }}
          branch-prefix: ${{ inputs.branch-prefix }}
          pr-title: ${{ inputs.pr-title }}
          commit-message: ${{ inputs.commit-message || inputs.pr-title }}
          auto-merge: ${{ inputs.auto-merge && 'true' || 'false' }}
          merge-method: ${{ inputs.merge-method }}
