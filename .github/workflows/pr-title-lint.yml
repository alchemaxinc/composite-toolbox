name: PR Title Lint

# Lints a pull request title against Conventional Commits with the shared
# commitlint config below, so every repository checks titles the same way.
#
# Call it from a workflow that triggers on `pull_request` with the `edited`
# type included: the default types (opened, synchronize, reopened) do not
# fire on title edits.

on:
  workflow_call:
    inputs:
      title:
        description: 'Title to lint. Defaults to the pull request title of the calling event.'
        required: false
        type: string
        default: ''

permissions: {}

env:
  COMMITLINT_VERSION: '21.2.3'

jobs:
  commitlint:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Cache commitlint
        id: cache-commitlint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/commitlint/node_modules
          key: commitlint-${{ runner.os }}-${{ env.COMMITLINT_VERSION }}

      - name: Install commitlint
        if: steps.cache-commitlint.outputs.cache-hit != 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/commitlint" --no-audit --no-fund \
            "@commitlint/cli@$COMMITLINT_VERSION" \
            "@commitlint/config-conventional@$COMMITLINT_VERSION"

      # The config lives next to node_modules so commitlint can resolve the
      # `extends` preset without a checkout of the calling repository.
      - name: Write the shared commitlint config
        run: |
          cat > "$RUNNER_TEMP/commitlint/commitlint.config.json" <<'CONFIG'
          {
            "extends": ["@commitlint/config-conventional"],
            "rules": {
              "header-max-length": [2, "always", 150]
            }
          }
          CONFIG

      - name: Lint PR title (conventional commit)
        env:
          PR_TITLE: ${{ inputs.title || github.event.pull_request.title }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "::error::No title to lint. Call this workflow from a pull_request event or pass the title input."
            exit 1
          fi
          printf '%s\n' "$PR_TITLE" | "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.json" \
            --verbose
