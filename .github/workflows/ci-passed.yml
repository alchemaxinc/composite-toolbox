name: CI Passed

# Reusable gate job for branch protection. The caller lists every job the
# gate waits for in its own `needs:` and passes `toJSON(needs)` as `results`.
# This job fails when any of those jobs failed or was cancelled, and passes
# when they all succeeded or were skipped.

on:
  workflow_call:
    inputs:
      results:
        description: "JSON of the calling job's `needs` context. Pass `toJSON(needs)`."
        required: true
        type: string

permissions: {}

jobs:
  verify:
    name: Verify all jobs passed or were skipped
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all jobs passed or were skipped
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          if ! jq -e 'type == "object" and length > 0' <<< "$RESULTS" >/dev/null; then
            echo "::error::The results input must be the non-empty JSON object from toJSON(needs). Add the gated jobs to the calling job's needs list."
            exit 1
          fi

          FAILED=$(jq -r '
            to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key) (\(.value.result))"
          ' <<< "$RESULTS")

          if [ -n "$FAILED" ]; then
            while IFS= read -r job; do
              echo "::error::Job failed or was cancelled: $job"
            done <<< "$FAILED"
            exit 1
          fi

          echo "All jobs passed or were skipped"
