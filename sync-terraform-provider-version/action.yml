name: 'Sync Terraform Provider Version'

description: >-
  Check or update a Terraform provider version constraint (for example,
  "~> 2") across a set of files that each declare it in a
  `required_providers`-style block.

inputs:
  mode:
    required: true
    description: >-
      Either "check" (fail if the files disagree on the constraint, or use
      anything other than a plain "~> N" pin) or "set" (rewrite the
      constraint in every file to the major version of "version").

  provider-source:
    required: true
    description: 'Provider source address to match, for example "alchemaxinc/balena"'

  files:
    required: true
    description: >-
      Space-separated list of files. Each must contain exactly one
      `source = "<provider-source>"` line immediately followed by a
      `version = "..."` line.

  version:
    required: false
    default: ''
    description: 'Full semantic version to pin to, for example "2.0.0". Required when mode is "set".'

outputs:
  files_updated:
    description: 'Space-separated list of files that were updated. Only set in "set" mode.'
    value: ${{ steps.run.outputs.files_updated }}

runs:
  using: 'composite'
  steps:
    - name: Sync Terraform provider version
      id: run
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PROVIDER_SOURCE: ${{ inputs.provider-source }}
        FILES: ${{ inputs.files }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "$MODE" in
          check | set) ;;
          *)
            echo "::error::'mode' must be 'check' or 'set', got '$MODE'."
            exit 1
            ;;
        esac

        if [ -z "$PROVIDER_SOURCE" ]; then
          echo "::error::'provider-source' input cannot be empty."
          exit 1
        fi

        if [ -z "$FILES" ]; then
          echo "::error::'files' input cannot be empty."
          exit 1
        fi

        # Split on whitespace into an array so each path is handled as its
        # own argument, instead of being glob-expanded by Bash.
        read -r -a FILES_ARR <<<"$FILES"

        NEW_CONSTRAINT=""
        if [ "$MODE" = "set" ]; then
          if [ -z "$VERSION" ]; then
            echo "::error::'version' input is required when mode is 'set'."
            exit 1
          fi

          # Accept a bare or "v"-prefixed semantic version, with optional
          # prerelease/build metadata suffixes.
          if [[ ! $VERSION =~ ^v?([0-9]+)\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version (expected X.Y.Z)."
            exit 1
          fi

          NEW_CONSTRAINT="~> ${BASH_REMATCH[1]}"
        fi

        FILES_UPDATED=""
        declare -A CONSTRAINTS

        for FILE in "${FILES_ARR[@]}"; do
          if [ ! -f "$FILE" ]; then
            echo "::error::File '$FILE' does not exist."
            exit 1
          fi

          # Curly-brace regex delimiters avoid clashing with the "/" in a
          # provider source such as "alchemaxinc/balena".
          MATCH_COUNT=$(PROVIDER_SOURCE="$PROVIDER_SOURCE" perl -0777 -ne '
            my $source = quotemeta($ENV{PROVIDER_SOURCE});
            my @matches = m{source\s*=\s*"$source"\s*\n\s*version\s*=\s*"[^"]*"}g;
            print scalar(@matches);
          ' "$FILE")

          if [ "$MATCH_COUNT" != "1" ]; then
            echo "::error::$FILE: expected exactly one '$PROVIDER_SOURCE' provider block with a version constraint, found $MATCH_COUNT."
            exit 1
          fi

          CURRENT_CONSTRAINT=$(PROVIDER_SOURCE="$PROVIDER_SOURCE" perl -0777 -ne '
            my $source = quotemeta($ENV{PROVIDER_SOURCE});
            if (m{source\s*=\s*"$source"\s*\n\s*version\s*=\s*"([^"]*)"}) {
              print $1;
            }
          ' "$FILE")

          if [[ ! $CURRENT_CONSTRAINT =~ ^~\>\ *[0-9]+$ ]]; then
            echo "::error::$FILE: version constraint '$CURRENT_CONSTRAINT' is not a plain '~> N' major-version pin."
            exit 1
          fi

          CONSTRAINTS["$FILE"]="$CURRENT_CONSTRAINT"

          if [ "$MODE" = "set" ]; then
            if [ "$CURRENT_CONSTRAINT" = "$NEW_CONSTRAINT" ]; then
              echo "::notice::$FILE: already pinned to '$NEW_CONSTRAINT', no change."
              continue
            fi

            PROVIDER_SOURCE="$PROVIDER_SOURCE" NEW_CONSTRAINT="$NEW_CONSTRAINT" perl -0777 -pi -e '
              my $source = quotemeta($ENV{PROVIDER_SOURCE});
              my $new = $ENV{NEW_CONSTRAINT};
              s{(source\s*=\s*"$source"\s*\n\s*version\s*=\s*")[^"]*(")}{$1$new$2};
            ' "$FILE"

            echo "::notice::$FILE: updated '$CURRENT_CONSTRAINT' -> '$NEW_CONSTRAINT'."
            FILES_UPDATED="$FILES_UPDATED $FILE"
          fi
        done

        if [ "$MODE" = "check" ]; then
          FIRST_FILE="${FILES_ARR[0]}"
          FIRST_CONSTRAINT="${CONSTRAINTS[$FIRST_FILE]}"
          MISMATCH=false

          for FILE in "${FILES_ARR[@]}"; do
            if [ "${CONSTRAINTS[$FILE]}" != "$FIRST_CONSTRAINT" ]; then
              MISMATCH=true
            fi
          done

          if [ "$MISMATCH" = "true" ]; then
            echo "::error::Provider version constraints are out of sync:"
            for FILE in "${FILES_ARR[@]}"; do
              echo "  $FILE: ${CONSTRAINTS[$FILE]}"
            done
            exit 1
          fi

          echo "::notice::Provider version constraints are in sync at '$FIRST_CONSTRAINT'."
        fi

        # Trim leading space
        FILES_UPDATED="${FILES_UPDATED# }"
        echo "files_updated=$FILES_UPDATED" >> "$GITHUB_OUTPUT"
