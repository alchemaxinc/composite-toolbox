name: 'Check for Existing Pull Request'

description: >-
  Check whether an open pull request with the given title already exists on the
  base branch. Exposes the result via the "exists" output so callers can skip
  creating a duplicate pull request.

inputs:
  token:
    required: true
    description: 'GitHub token used to query pull requests'

  pr-title:
    required: true
    description: 'Pull request title to look for'

  base-branch:
    required: true
    description: 'Base branch to search open pull requests against'

  head-branch:
    required: false
    default: ''
    description: 'Head branch a matching pull request must also have; if left empty, only the title and base branch are matched'

outputs:
  exists:
    description: 'Whether an open PR with the given title already exists ("true" or "false")'
    value: ${{ steps.check_existing_pr.outputs.exists }}

  pr-number:
    description: 'Number of the matching open pull request, empty if none exists'
    value: ${{ steps.check_existing_pr.outputs.pr-number }}

runs:
  using: 'composite'
  steps:
    - name: Check for existing pull request
      id: check_existing_pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.pr-title }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        HEAD_BRANCH: ${{ inputs.head-branch }}
      run: |
        # shellcheck disable=SC2054 # the comma is gh's own --json value syntax, not an array separator
        ARGS=(--repo "$GITHUB_REPOSITORY" --state open --base "$BASE_BRANCH" --limit 1000 --json title,number)
        if [ -n "$HEAD_BRANCH" ]; then
          ARGS+=(--head "$HEAD_BRANCH")
        fi

        existing=$(gh pr list "${ARGS[@]}" \
          --jq '[.[] | select(.title == env.PR_TITLE)] | .[0].number // empty')

        if [ -n "$existing" ]; then
          echo "::notice::Open PR #$existing with title \"$PR_TITLE\" already exists; skipping PR creation"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi
        echo "pr-number=$existing" >> "$GITHUB_OUTPUT"
