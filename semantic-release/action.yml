name: 'Semantic Release'

description: 'Run semantic-release with caching and optional backmerge support'

outputs:
  version:
    description: 'The version of the new release (e.g., 1.2.3), empty if no release was made'
    value: ${{ steps.release.outputs.version }}
  tag:
    description: 'The git tag of the new release (e.g., v1.2.3), empty if no release was made'
    value: ${{ steps.release.outputs.tag }}

inputs:
  token:
    required: true
    description: 'GitHub token for authentication'
    default: ${{ github.token }}

  enable-backmerge:
    required: false
    description: 'Enable backmerge from main to develop after release'
    default: 'false'

  backmerge-target-branch:
    required: false
    description: 'Target branch for backmerge (only used when enable-backmerge is true)'
    default: 'develop'

  source-branch:
    required: false
    description: 'Source branch for semantic-release (typically main)'
    default: 'main'

  merge-strategy:
    required: false
    description: "Merge strategy for backmerge. Supported values: 'merge' (merge commit, default), 'squash' (squash and merge), 'rebase' (rebase and merge)"
    default: 'merge'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        token: ${{ inputs.token }}

    - name: Configure git identity
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/configure-git-identity.sh" --global

    - name: Cache semantic-release
      id: cache-sr
      uses: actions/cache@v6
      with:
        path: ~/.npm-global
        key: "npm-sr-${{ runner.os }}-${{ hashFiles('*releaserc*', '**/package-lock.json', '**/package.json') }}"
        restore-keys: |
          npm-sr-${{ runner.os }}-

    - name: Install semantic-release and plugins
      if: steps.cache-sr.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm config set prefix "$HOME/.npm-global"

        # Extract plugin names from .releaserc
        PLUGINS=$(jq -r '.plugins[] | if type == "string" then . else .[0] end' .releaserc* 2>/dev/null || echo "")

        # Build the package list with semantic-release and all plugins
        PACKAGES=(semantic-release)
        if [ -n "$PLUGINS" ]; then
          while IFS= read -r plugin; do
            [ -n "$plugin" ] && PACKAGES+=("$plugin")
          done <<< "$PLUGINS"
        fi

        npm install -g "${PACKAGES[@]}"

    - name: Add ~/.npm-global/bin to PATH
      shell: bash
      run: echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

    - name: Capture pre-existing tags at HEAD
      id: pre-release-tags
      shell: bash
      run: |
        git fetch --tags origin
        BEFORE=$(git tag --points-at HEAD | sort | paste -sd ',' -)
        echo "tags=$BEFORE" >> "$GITHUB_OUTPUT"

    - name: Run semantic-release
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: semantic-release

    - name: Resolve release outputs
      id: release
      shell: bash
      env:
        TAGS_BEFORE: ${{ steps.pre-release-tags.outputs.tags }}
      run: |
        git fetch --tags origin
        # Only emit a tag when semantic-release actually created a new one at HEAD.
        # Comparing against the pre-existing tag set prevents picking up tags that
        # were created by a prior workflow run on a different branch (e.g. a main
        # release tag that became visible on develop after a backmerge of the same
        # commit).
        BEFORE_SORTED=$(printf '%s\n' "$TAGS_BEFORE" | tr ',' '\n' | sort -u)
        AFTER_SORTED=$(git tag --points-at HEAD | sort -u)
        TAG=$(comm -13 <(echo "$BEFORE_SORTED") <(echo "$AFTER_SORTED") | sort -V | tail -1)

        if [ -n "$TAG" ]; then
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        fi

    - name: Backmerge to develop
      if: >-
        inputs.enable-backmerge == 'true' &&
        github.ref == format('refs/heads/{0}', inputs.source-branch) &&
        steps.release.outputs.tag != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        MERGE_STRATEGY: ${{ inputs.merge-strategy }}
        SOURCE_BRANCH: ${{ inputs.source-branch }}
        TARGET_BRANCH: ${{ inputs.backmerge-target-branch }}
      run: |
        if [[ "$MERGE_STRATEGY" != "merge" && "$MERGE_STRATEGY" != "squash" && "$MERGE_STRATEGY" != "rebase" ]]; then
          echo "::error::Invalid merge-strategy '$MERGE_STRATEGY'. Supported values: merge, squash, rebase"
          exit 1
        fi

        git fetch origin "$TARGET_BRANCH"
        git checkout "$TARGET_BRANCH"

        case "$MERGE_STRATEGY" in
          merge)
            git merge "$SOURCE_BRANCH" --no-ff -m "chore: backmerge $SOURCE_BRANCH after release"
            ;;
          squash)
            git merge "$SOURCE_BRANCH" --squash
            if git diff --cached --quiet; then
              echo "::notice::No changes to commit after squash merge — branches are already in sync"
              exit 0
            fi
            git commit -m "chore: backmerge $SOURCE_BRANCH after release"
            ;;
          rebase)
            git rebase "$SOURCE_BRANCH"
            ;;
        esac

        if [ "$MERGE_STRATEGY" = "rebase" ]; then
          # Rebase rewrites the target branch's history, so a plain push would
          # be rejected as non-fast-forward. force-with-lease still fails
          # safely if someone else pushed to the target branch meanwhile.
          git push --force-with-lease origin "$TARGET_BRANCH"
        else
          git push origin "$TARGET_BRANCH"
        fi
