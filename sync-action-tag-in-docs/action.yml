name: 'Sync Action Tag in Docs'

description: 'Update GitHub action tags in documentation files to match the current version'

inputs:
  file-extensions:
    required: false
    default: '.md'
    description: 'Space-separated list of file extensions to scan (for example, ".md .txt")'

  github-repo-path:
    required: true
    description: 'GitHub repository path (for example, "alchemaxinc/update-deps")'

  folder:
    required: false
    default: '.'
    description: 'Folder to scan for files (defaults to repository root)'

  current-tag:
    required: true
    description: 'Current GitHub tag to update to (for example, "v1.10.2")'

outputs:
  files_updated:
    description: 'Space-separated list of files that were updated'
    value: ${{ steps.update.outputs.files_updated }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        TAG: ${{ inputs.current-tag }}
        FOLDER: ${{ inputs.folder }}
        EXTENSIONS: ${{ inputs.file-extensions }}
      run: |
        set -euo pipefail

        echo "::debug::Validating tag: $TAG"

        if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Tag '$TAG' must be a full semantic version with v prefix (for example, v1.10.2 or v1.10.2-beta.1)"
          exit 1
        fi

        # Reject paths that can escape the workspace: absolute, '~', or '..'.
        if [[ $FOLDER == /* || $FOLDER == ~* || $FOLDER == *..* ]]; then
          echo "::error::The 'folder' input '$FOLDER' must be a relative path inside the repository and must not contain '..'."
          exit 1
        fi

        if [ ! -d "$FOLDER" ]; then
          echo "::error::The 'folder' input '$FOLDER' does not exist or is not a directory."
          exit 1
        fi

        if [ -z "$EXTENSIONS" ]; then
          echo "::error::The 'file-extensions' input cannot be empty."
          exit 1
        fi

        echo "::debug::Validation passed: tag=$TAG folder=$FOLDER extensions=$EXTENSIONS"

    - name: Find files to scan
      id: find
      shell: bash
      env:
        FOLDER: ${{ inputs.folder }}
        EXTENSIONS: ${{ inputs.file-extensions }}
      run: |
        set -euo pipefail

        # Build the find predicate as an array to avoid eval.
        # Skip vendored and VCS directories.
        FIND_ARGS=(-type f "(")
        first=true
        for ext in $EXTENSIONS; do
          if [ "$first" = true ]; then
            first=false
          else
            FIND_ARGS+=(-o)
          fi
          FIND_ARGS+=(-name "*$ext")
        done
        FIND_ARGS+=(")")

        # Do not discard find's stderr. A real error (for example, an
        # unreadable directory) must not look like "no files found".
        readarray -t FILES < <(find "$FOLDER" \
          \( -path '*/.git' -o -name 'node_modules' \) -prune -o \
          "${FIND_ARGS[@]}" -print)

        if [ "${#FILES[@]}" -eq 0 ]; then
          echo "::notice::No files found with extensions: $EXTENSIONS"
        fi

        {
          echo "files<<FILES_EOF"
          printf '%s\n' "${FILES[@]}"
          echo "FILES_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Update tags in files
      id: update
      shell: bash
      env:
        FILES: ${{ steps.find.outputs.files }}
        REPO_PATH: ${{ inputs.github-repo-path }}
        NEW_TAG: ${{ inputs.current-tag }}
      run: |
        set -euo pipefail

        FILES_UPDATED=""

        # Escape regex metacharacters so the repo path is a literal
        # in grep and sed.
        ESCAPED_REPO_PATH=$(printf '%s' "$REPO_PATH" | sed -e 's/[.[\*^$]/\\&/g' -e 's|/|\\/|g')

        # shellcheck disable=SC2153 # FILES (the env var) is intentionally distinct from file (the loop variable).
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if [ ! -f "$file" ]; then
            continue
          fi

          echo "::debug::Processing file: $file"

          # Match a reference like owner/repo/path@vX and replace the tag.
          if ! grep -q "${ESCAPED_REPO_PATH}[^@]*@v[0-9]" "$file"; then
            echo "::debug::No matching references in $file"
            continue
          fi

          echo "::debug::Found references in $file, updating..."

          # Copy the file to a temp file for a before/after comparison.
          # A trap on RETURN does not work at the top level of a script,
          # so use EXIT and clear it after each file.
          tmp_orig=$(mktemp)
          trap 'rm -f "$tmp_orig"' EXIT
          cp "$file" "$tmp_orig"

          # Replace repo-path/subpath@vX with repo-path/subpath@NEW_TAG.
          # This matches @v1, @v1.2, @v1.2.3, and prerelease or build
          # suffixes such as @v1.2.3-beta.1 or @v1.2.3+build.5.
          sed -i "s|\(${ESCAPED_REPO_PATH}/[^@]*\)@v[0-9][0-9A-Za-z.+-]*|\1@${NEW_TAG}|g" "$file"

          # Also match a bare repo reference with no subpath: repo-path@vX.
          sed -i "s|\(${ESCAPED_REPO_PATH}\)@v[0-9][0-9A-Za-z.+-]*|\1@${NEW_TAG}|g" "$file"

          if ! cmp -s "$file" "$tmp_orig"; then
            echo "::notice::Updated tags in $file to $NEW_TAG"
            FILES_UPDATED="$FILES_UPDATED $file"
          fi

          rm -f "$tmp_orig"
          trap - EXIT
        done <<<"$FILES"

        # Trim leading space
        FILES_UPDATED="${FILES_UPDATED# }"

        echo "::notice::Updated files: $FILES_UPDATED"
        echo "files_updated=$FILES_UPDATED" >> "$GITHUB_OUTPUT"
